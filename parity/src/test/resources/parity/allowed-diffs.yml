# v1과 v2(v1compat)의 의도한 차이. 등록 규칙은 docs/parity.md "허용 차이 등록".
# 여기 없는 차이는 parityTest를 실패시킨다. 실제 버그는 여기에 넣지 않는다(@ParityKnownFailure 시나리오로 분리).
#
# 항목: endpoint(METHOD /경로 glob, 경로의 @{별칭}은 {id}), path(차이 경로 glob: [*] 인덱스, * 키 하나, ** 아무 경로, {a,b}),
#       kind(changed/only-v1/only-v2/order), sortBy(order 전용), v1/v2(그 값일 때만), onlyErrors(양쪽 모두 4xx·5xx일 때만),
#       scenario(시나리오 이름, 생략 시 전부), reason(필수), ref(근거).
# 넓은 경로를 쓸 때는 v1/v2 값 조건이나 scenario로 좁힌다.

# ---------------------------------------------------------------------------
# 에러 바디 문구
# ---------------------------------------------------------------------------
- endpoint: "*"
  path: $.message
  kind: changed
  onlyErrors: true
  reason: >-
    v1은 개발자용 문구(ErrorType.errorMessage), v1compat은 displayMessage와 같은 사용자용 문구를 준다. 에러 바디의 message는
    두 앱 모두 읽지 않는다(Android ErrorBodyDto는 파싱만 하고 displayTitle/displayMessage만 씀, iOS ErrorDecodingMiddleware는 title/displayMessage만 읽음).
  ref: docs/v1-compat-audit.md "에러 응답"
- endpoint: "*"
  path: $.title
  kind: changed
  onlyErrors: true
  reason: >-
    v1 title은 대부분 기본값 "요청 실패"였고 v2는 에러마다 제목을 준다(iOS는 이 값을 알림 제목으로 쓴다). errcode는 따로 비교한다.
  ref: docs/v1-compat-audit.md "에러 응답"
- endpoint: "*"
  path: $.displayMessage
  kind: changed
  onlyErrors: true
  reason: >-
    v2가 사용자용 에러 문구를 새로 썼다(x-language에 따라 ko/en). 앱은 이 문구를 그대로 보여 주고 분기는 errcode로 한다.
    errcode가 같은지는 따로 비교하므로 문구만 다른 경우다. 문구 검수는 리포트의 허용 차이 목록으로 한다.
  ref: docs/v1-compat-audit.md "에러 응답"
- endpoint: "*"
  path: $.errcode
  kind: changed
  v1: 0
  v2: 40002
  onlyErrors: true
  reason: >-
    v1은 WebFlux 바디 오류(파싱 실패, 잘못된 enum)를 errcode 0으로 냈고 v2는 40002를 낸다. 상태 코드는 따로 비교한다(둘 다 400이어야 함).
  ref: docs/v1-compat-audit.md "에러 응답", #59

# ---------------------------------------------------------------------------
# 이관이 바꾸는 값
# ---------------------------------------------------------------------------
- endpoint: "*"
  path: $.**.{category,remark,instructor,academic_year,classification,department,categoryPre2025}
  kind: only-v1
  v1: ""
  reason: >-
    이관이 빈 문자열을 NULL로 넣고(LectureStep·TimetableStep의 nullIfBlank) v2는 null 필드를 생략한다. 두 앱 모두 이 필드가
    없어도 된다(Android LectureDto: instructor·remark 기본값 "", category nullable / iOS LectureDto required 목록에 없음).
- endpoint: "*"
  path: $.**.snuttEvLecture
  kind: only-v2
  reason: >-
    v1은 EV가 그 강의를 알 때만 snuttEvLecture를 붙였다. v2는 EV 과목이 없는 강의에도 과목(course)을 만들고(CourseStep.mintMissingCourses)
    courseId가 있으면 항상 붙인다. 앱은 이 값으로 강의평 화면을 열고, 그 과목은 강의평 0개로 정상 조회된다.
  ref: docs/v1-compat-audit.md "시간표·강의 snuttEvLecture"
- endpoint: "*"
  path: $.**.colorIndex
  kind: changed
  v1: 12
  v2: 3
  reason: >-
    v1 문서의 팔레트 번호가 범위(1~9) 밖이었다. 이관이 (번호-1) mod 9로 고친다(PALETTE_INDEX_OUT_OF_RANGE). v1 앱은 범위 밖 번호를 그릴 수 없었다.
- endpoint: GET /v1/tables/{id}
  path: $.lecture_list[*].color
  kind: only-v1
  v1: {bg: "#ABCDEF"}
  scenario: "시간표 조회: 이관 데이터"
  reason: 배경색만 있던 직접 만든 강의 색을 이관이 팔레트 색으로 바꾼다(INVALID_CUSTOM_COLOR). 같은 강의의 colorIndex 차이도 같은 이유다.
- endpoint: GET /v1/tables/{id}
  path: $.lecture_list[*].colorIndex
  kind: changed
  v1: 0
  v2: 1
  scenario: "시간표 조회: 이관 데이터"
  reason: 위 항목과 같은 강의(INVALID_CUSTOM_COLOR). 이관은 색을 버리고 팔레트 첫 색을 쓴다.
- endpoint: GET /v1/configs
  path: $.vacancy_notification.visible
  kind: changed
  v1: false
  v2: true
  reason: >-
    같은 이름의 설정이 여러 개면 v1은 먼저 만든 것, v2는 가장 최근 것을 쓴다. 시드에 같은 이름 설정 둘을 넣었다(먼저 false, 나중 true).
  ref: docs/v1-compat-audit.md #36
- endpoint: GET /v1/tags/*
  path: $.updated_at
  kind: changed
  reason: >-
    v1은 수강편람 동기화 배치가 taglists 문서에 적은 시각, v2는 그 학기 강의의 최종 수정 시각(이관 시각)을 준다. 앱은 값이 바뀌면 태그를 다시 받을 뿐이라
    전환 직후 한 번 더 받는다.

# 이관이 정리한 레거시 데이터 (시나리오 한정)
- endpoint: GET /v1/tables
  path: $[*].{isPrimary,title}
  kind: changed
  scenario: "앱 시작: 소셜 계정(bob, carol, dave)"
  label: GET /v1/tables
  reason: >-
    시나리오에서 시간표 목록은 dave만 조회한다. 같은 학기에 제목이 같고 둘 다 대표인 시간표 두 개(dave). 이관이 가장 최근에 고친 쪽만 대표로 남기고(PRIMARY_TIMETABLE_DUPLICATE)
    두 번째 제목에 " (2)"를 붙인다(TIMETABLE_TITLE_DUPLICATE, v2 유일 제약).
- endpoint: GET /v1/friends/{id}/primary-table
  path: $.{id,title,updatedAt}
  kind: changed
  scenario: 친구 조회
  reason: 위와 같은 dave의 시간표. v1은 대표 둘 중 먼저 찾은 것, v2는 이관이 남긴 대표(최근에 고친 쪽, 제목 " (2)")를 준다.
- endpoint: POST /v1/auth/login_local
  path: "**"
  scenario: "로그인: 아이디 중복 계정(frank)"
  reason: >-
    같은 아이디를 쓰는 활성 계정 둘. v1은 로그인에서 IncorrectResultSizeDataAccessException으로 500이었다. 이관은 최종 로그인이 최신인 계정에만
    로컬 로그인 수단을 남기므로(LOCAL_ID_DUPLICATE) v2는 그 계정으로 로그인된다.
- endpoint: GET /v1/users/me
  path: $.localId
  kind: only-v1
  v1: frank
  scenario: "로그인: 아이디 중복 계정(frank)"
  reason: 위와 같은 이유로 최종 로그인이 오래된 계정(frank-old)의 로컬 아이디가 사라진다.
- endpoint: "*"
  path: status
  v1: 500
  v2: 403
  scenario: "인증: 공유 credentialHash(grace, heidi)"
  reason: >-
    두 계정이 같은 credentialHash를 가졌다. v1은 토큰 조회에서 non unique result로 500이었다. 이관은 이런 토큰을 옮기지 않으므로
    (LEGACY_TOKEN_AMBIGUOUS) v2는 403 0x2002를 주고 앱이 다시 로그인시킨다.
  ref: docs/v1-compat-audit.md "마이그레이션 관련 관찰 - 레거시 토큰"
- endpoint: "*"
  path: $.errcode
  v1: 0
  v2: 8194
  onlyErrors: true
  scenario: "인증: 공유 credentialHash(grace, heidi)"
  reason: 위와 같다(v1 500 errcode 0 → v2 0x2002). 문구는 에러 문구 항목이 다룬다.
# ---------------------------------------------------------------------------
# 무작위 값
# ---------------------------------------------------------------------------
- endpoint: GET /v1/users/me
  path: $.nickname.{nickname,tag}
  kind: changed
  scenario: "가입: 로컬"
  reason: 가입할 때 닉네임(형용사+명사)과 태그를 무작위로 만든다. 두 서버가 같은 값을 낼 수 없다.
- endpoint: "* /v1/users/me"
  path: $.nickname.tag
  kind: changed
  scenario: 계정 정보 수정
  reason: 닉네임을 바꾸면 태그를 무작위로 새로 뽑는다.

# ---------------------------------------------------------------------------
# 표현이 다르지만 앱에서 같은 결과
# ---------------------------------------------------------------------------
- endpoint: "*"
  path: $.**.colorIndex
  kind: changed
  v2: 0
  scenario: ["시간표 조회: 이관 데이터", "시간표 CRUD", "직접 만든 강의"]
  reason: >-
    사용자 테마를 쓰는 시간표에서 v1은 팔레트 번호만, v1compat은 colorIndex 0과 그 팔레트 색(color)을 함께 준다
    (LegacyTimetableDtos.legacyColorIndex/legacyColor). Android(LectureMappers.colorToLectureColor)는 colorIndex 0이면 color를 그대로 그리므로
    화면의 색은 같다. 대상 시나리오만 사용자 테마 시간표(alice-plan-b, 테마를 바꾼 새 시간표)를 다룬다.
- endpoint: "*"
  path: $.**.color
  kind: only-v2
  scenario: ["시간표 조회: 이관 데이터", "시간표 CRUD", "직접 만든 강의"]
  reason: 위 항목과 같은 이유로 사용자 테마 시간표의 강의에 v2만 color를 준다.
- endpoint: "*"
  path: $.**.color
  kind: only-v1
  v1: {bg: "#123456", fg: "#FFFFFF"}
  scenario: 직접 만든 강의
  reason: >-
    직접 만든 강의를 colorIndex 3으로 고치면 v1은 예전 색(color)을 지우지 않고 남겼다. colorIndex가 0이 아니면 앱은 color를 보지 않는다
    (Android LectureMappers.colorToLectureColor).

# ---------------------------------------------------------------------------
# 목록 순서 (앱이 다시 정렬하지 않으므로 화면 순서가 바뀐다. v2 쿼리에 명시적 정렬이 있는 경우만 의도한 변경으로 본다)
# ---------------------------------------------------------------------------
- endpoint: GET /v1/friends
  path: $.content
  kind: order
  sortBy: [nickname.nickname, nickname.tag]
  reason: >-
    v1 순서는 친구 사용자 문서의 자연 순서(findAllByIdInAndActiveTrue, 사실상 상대 가입 순)였고, v2는 친구 관계 created_at desc로
    명시적으로 정렬한다(FriendRepository …OrderByCreatedAtDesc). 원소 구성은 같다. Android는 다시 정렬하지 않으므로 화면 순서가 바뀐다(판단 필요로 보고).
  ref: docs/v1-compat-audit.md #80
- endpoint: GET /v1/bookmarks
  path: $.lectures
  kind: order
  sortBy: [course_number, lecture_number]
  reason: >-
    v1은 담은 순서(문서 배열 끝에 추가), v2는 강의 id 순으로 명시적으로 정렬한다(BookmarkLectureRepository.findLectures ORDER BY l.id).
    원소 구성은 같다. 화면 순서가 바뀐다(판단 필요로 보고).
  ref: docs/v1-compat-audit.md #91
- endpoint: GET /v1/push/preferences
  path: $.pushPreferences
  kind: order
  sortBy: [type]
  reason: 두 앱 모두 목록을 type으로 찾아 쓴다(Android UserMappers, iOS PushNotificationAPIRepository). 순서는 화면에 영향이 없다.

# ---------------------------------------------------------------------------
# docs/v1-compat-audit.md에 적힌 의도한 동작 변경
# ---------------------------------------------------------------------------
- endpoint: GET /v1/friends/{id}/primary-table
  path: $.errcode
  kind: changed
  v1: 40400
  v2: 40401
  reason: 친구가 그 학기에 시간표가 없음. v2는 '대표 시간표 없음'(40401)으로 나눴다. 두 앱 모두 이 코드로 분기하지 않고 문구만 보여 준다.
  ref: docs/v1-compat-audit.md #88
- endpoint: GET /v1/tags/*
  path: $.errcode
  kind: changed
  v1: 40408
  v2: 40420
  reason: 태그 목록 없음 40408 → 수강편람 없음 40420.
  ref: docs/v1-compat-audit.md #77
- endpoint: PUT /v1/user/password
  path: $.errcode
  kind: changed
  v1: 8197
  v2: 12288
  scenario: 계정 정보 수정
  reason: 로컬 아이디가 없는 소셜 전용 사용자의 비밀번호 변경. v1 0x2005(비밀번호 틀림) → v2 0x3000(아이디 없음).
  ref: docs/v1-compat-audit.md #22
- endpoint: PUT /v1/tables/{id}
  path: "**"
  scenario: 시간표 CRUD
  label: 같은 제목으로 저장
  reason: 제목을 바꾸지 않고 저장하면 v1은 자기 자신과 겹친다고 0x3003을 냈고 v2는 200이다.
  ref: docs/v1-compat-audit.md #46
- endpoint: GET /v1/bookmarks
  path: $.lectures[*].categoryPre2025
  kind: only-v2
  reason: v1 북마크 응답 DTO에 없던 필드를 v2가 더 준다. 모르는 필드는 두 앱 모두 무시한다.
  ref: docs/v1-compat-audit.md #91
- endpoint: POST /v1/search_query
  path: $[1]
  kind: only-v1
  scenario: 강의 검색
  label: 중복 개설 학기
  reason: v1 lectures에 같은 (연도, 학기, 교과목번호, 분반) 문서가 둘이었다. 이관이 하나로 합친다(LECTURE_DUPLICATE).
- endpoint: GET /v1/bookmarks
  path: $.lectures[*]
  kind: only-v1
  v1: {_id: "@lecture:gone"}
  scenario: 북마크
  label: 수강편람에서 사라진 강의를 담은 사용자
  reason: >-
    v1 북마크는 강의 사본을 들고 있어 수강편람에서 사라진 강의도 보였다. v2 북마크는 강의를 참조하므로 이관이 그 항목을 뺀다
    (BOOKMARK_LECTURE_MISSING).
- endpoint: GET /v1/push/preferences
  path: $.pushPreferences
  kind: only-v1
  element: {type: NORMAL}
  scenario: 푸시 설정
  label: 저장 후 조회
  reason: >-
    v1은 저장할 때 보내지 않은 종류(NORMAL)도 기본값으로 함께 저장했고 v2는 보낸 종류만 남긴다. 두 앱은 NORMAL을 읽지도 보내지도
    않는다(LECTURE_UPDATE·VACANCY_NOTIFICATION·DIARY 세 개만).
  ref: docs/v1-compat-audit.md #99

# ---------------------------------------------------------------------------
# 강의평(EV)
# ---------------------------------------------------------------------------
- endpoint: "* /ev-service/v1/**"
  path: $.**.evaluation_count
  kind: only-v2
  reason: >-
    [dev] 운영 EV(main)에는 없고 develop에만 있는 필드(aaefbf0)다. v1compat은 develop 기준으로 항상 준다. 모르는 필드는 클라이언트가 무시한다.
  ref: docs/v1-compat-audit.md E1, E10
- endpoint: "* /ev-service/v1/**"
  path: $.**.is_mine
  kind: only-v2
  reason: v1compat이 내 강의평 여부를 더 준다(본인 강의평 상단 노출, b5173d1).
  ref: docs/v1-compat-audit.md E11, E15
- endpoint: "* /ev-service/v1/**"
  path: $.**.like_count
  kind: changed
  v1: 2
  v2: 1
  scenario: ["강의평 웹: 조회", "강의평 웹: 쓰기"]
  reason: >-
    시드 강의평(bob-os)의 공감 2개 중 하나는 없는 사용자의 것이다. 이관이 그 공감을 빼고(EVALUATION_LIKE_USER_MISSING) 공감 수를 다시 센다.
- endpoint: GET /ev-service/v1/tags/main
  path: $.tags
  kind: only-v2
  element: {id: 317}
  reason: v1compat이 메인 태그에 교양(317)을 더했다.
  ref: docs/v1-compat-audit.md E21
- endpoint: GET /ev-service/v1/tags/main
  path: $.tags[*].key
  kind: only-v2
  reason: v1compat이 메인 태그에 고정 key를 더했다(a2e5724).
  ref: docs/v1-compat-audit.md E21
- endpoint: GET /ev-service/v1/tags/main
  path: $.tags[*].ordering
  kind: changed
  reason: 교양(317)이 두 번째에 끼면서 뒤 태그의 ordering이 1씩 밀렸다. 웹은 받은 순서대로 그린다.
  ref: docs/v1-compat-audit.md E21
- endpoint: GET /ev-service/v1/tags/search
  path: $.tag_groups
  kind: order
  sortBy: [name]
  reason: >-
    v1 EV는 태그 그룹을 이름 순으로, v1compat은 ordering 순으로 준다. 원소 구성은 같다. 강의평 웹의 검색 필터 순서가 바뀐다(판단 필요로 보고).
  ref: docs/v1-compat-audit.md E22
- endpoint: GET /ev-service/v1/tags/search
  path: $.tag_groups[*].id
  kind: changed
  reason: 태그 그룹 id가 v1은 PK, v1compat은 ordering 값이다. 강의평 웹은 그룹 id로 요청하지 않는다(태그 id로 검색).
  ref: docs/v1-compat-audit.md E22
- endpoint: GET /ev-service/v1/lectures
  path: $.content
  kind: only-v2
  element: {id: "@course-minted:*"}
  reason: >-
    이관은 EV 과목이 없는 SNUTT 강의에도 과목을 만들므로(CourseStep.mintMissingCourses) 강의평 0개인 과목이 EV 검색에 새로 나온다.
    v1 EV 검색에는 강의평 서비스에 등록된 과목만 나왔다.
- endpoint: GET /ev-service/v1/lectures
  path: $.total_count
  kind: changed
  scenario: "강의평 웹: 조회"
  label: 빈 검색어
  reason: 위 항목의 새 과목(이관이 만든 과목 3개)만큼 전체 개수가 늘어난다.
- endpoint: GET /ev-service/v1/lectures
  path: $.content
  kind: order
  sortBy: [id]
  reason: v1 EV는 DB 순서, v1compat은 강의평 수 desc, id asc로 명시적으로 정렬한다. 원소 구성은 같다(판단 필요로 보고).
  ref: docs/v1-compat-audit.md E1
- endpoint: GET /ev-service/v1/lectures/{id}/semester-lectures
  path: $.semester_lectures[*].id
  kind: changed
  reason: EV semester_lecture id는 이관되지 않고 v2 강의 id로 바뀐다(EvLectureStep). 강의평 웹은 이 id로 강의평을 쓰므로 같은 응답 안에서 일관된다.
  ref: docs/v1-compat-audit.md E2, "마이그레이션 관련 관찰 - EV id"
- endpoint: GET /ev-service/v1/users/me/lectures/latest
  path: $.content[*].{avg_rating,evaluation_count,my_evaluation_exists,recent_evaluations}
  kind: only-v2
  reason: v1compat이 수강 강의 목록에 평점 정보를 더 준다(b5173d1).
  ref: docs/v1-compat-audit.md #115
- endpoint: "* /ev-service/v1/evaluations/{id}/likes"
  path: "{header:Content-Type,$}"
  reason: v1 EV는 빈 바디 200, v1compat은 {like_count, is_liked}를 준다(5b9efc2). 빈 바디를 기대하던 웹은 바디를 읽지 않는다.
  ref: docs/v1-compat-audit.md E19, E20
- endpoint: GET /v1/ev/lectures/{id}/summary
  path: "**"
  scenario: 강의평 요약(앱)
  label: EV 과목 없는 강의
  reason: >-
    EV가 모르는 강의에서 v1은 404 40407, v2는 이관이 만든 과목으로 200 {evaluationCount: 0}을 준다. 앱은 강의평 0개로 보여 준다.
  ref: docs/v1-compat-audit.md #108

# ---------------------------------------------------------------------------
# 무작위 색 선택 (결정적인 경우는 "강의 추가: 색 자동 선택"이 비교한다)
# ---------------------------------------------------------------------------
- endpoint: "*"
  path: $.lecture_list[*].colorIndex
  kind: changed
  scenario: "강의 추가: 겹침과 강제 추가"
  reason: >-
    색을 주지 않고 강의를 추가하면 두 서버 모두 가장 덜 쓴 팔레트 번호 중 하나를 무작위로 고른다(v1 TimetableThemeService.getNewColorIndexAndColor,
    v2 TimetableLectureService.newPaletteIndex). 후보가 여럿이면 값이 다를 수 있다. 후보가 하나인 경우는 "강의 추가: 색 자동 선택"에서 같아야 한다.

# ---------------------------------------------------------------------------
# 테마
# ---------------------------------------------------------------------------
- endpoint: GET /v1/themes
  path: $
  kind: order
  sortBy: [name]
  reason: v1은 사용자 테마를 updatedAt desc, v1compat은 id asc로 정렬한다. 원소 구성은 같다.
  ref: docs/v1-compat-audit.md #60
- endpoint: GET /v1/themes
  path: $[*].publishInfo
  kind: only-v2
  reason: 게시한 사용자 테마에 v1compat은 publishInfo(게시 이름, 작성자, 다운로드 수)를 채워 준다. v1 목록은 비워 보냈다.
  ref: docs/v1-compat-audit.md #60
- endpoint: GET /v1/themes
  path: $[*].origin.originId
  kind: changed
  reason: 다운로드한 테마의 originId가 v1은 원본 테마 id, v1compat은 게시본(published_theme) id다. 다운로드·마켓 API도 게시본 id를 받으므로 v1compat 안에서 일관된다.
  ref: docs/v1-compat-audit.md "테마 - DOWNLOADED origin.originId"
- endpoint: GET /v1/themes/{id}
  path: $.isDefault
  kind: changed
  v1: false
  reason: v1의 단건 조회는 isDefault를 계산하지 않아 늘 false였다(@Transient 기본값). v1compat은 실제 값을 준다.
  ref: docs/v1-compat-audit.md #63
- endpoint: GET /v1/themes
  path: $[*].isDefault
  kind: changed
  scenario: 테마 CRUD
  reason: >-
    v1의 기본 테마는 "가장 최근에 고친 사용자 테마"라 테마를 추가·복사하면 바뀌었다. v2는 사용자가 지정한 기본 테마를 저장해 두고 추가해도 바꾸지 않는다.
  ref: docs/v1-compat-audit.md "테마 - 기본 테마 의미", #64, #65
- endpoint: "GET /v1/themes/{best,friends}*"
  path: $.content[*].{id,name}
  kind: changed
  reason: >-
    테마 마켓 항목의 id가 v1은 게시자 테마 id, v1compat은 게시본(published_theme) id이고, name은 게시본 이름(publishName, ThemeStep이 게시본 name으로 옮김)이다.
    다운로드도 게시본 id를 받는다. 테마 마켓 웹이 name 대신 publishInfo.publishName을 보여 주는지는 확인 필요(판단 필요로 보고).
  ref: docs/v1-compat-audit.md #61, #62, "테마 마켓 id"
- endpoint: POST /v1/themes/search
  path: $.content[*].{id,name}
  kind: changed
  reason: 위 테마 마켓 항목과 같다.
  ref: docs/v1-compat-audit.md #68

# ---------------------------------------------------------------------------
# 정적 페이지
# ---------------------------------------------------------------------------
- endpoint: GET /*
  path: "{status,header:Content-Type,header:Location,$}"
  scenario: 정적 페이지
  reason: v1은 HTML을 200으로 줬고 v2는 /v2/static/...으로 301 리다이렉트한다. Android 웹뷰는 리다이렉트를 따라간다.
  ref: docs/v1-compat-audit.md #105-#107
