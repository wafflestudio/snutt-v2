# v1 snutt(versions.properties의 snutt.sha) 컨테이너 설정. spring.config.location으로 jar 안의 설정을 통째로 대신한다.
# 내용은 v1 api/application.yml + core/application-common.yml의 프로파일 없는 부분과 같고, 다음만 다르다.
# - oci.vault.secret-ids 없음: 있으면 기동 중에 OCI Vault를 네트워크로 조회한다(빈 값도 조회를 시도한다).
# - 접속 정보(mongo, redis, EV, secret-key)는 컨테이너 기동 인자로 넣는다(ParityContainers.kt). 활성 프로파일은 prod다
#   (v1 PhaseUtils가 phase를 프로파일로 정함). 이 파일에는 프로파일별 구역이 없으므로 운영 설정은 들어오지 않는다.
# - parity.*: SDK 경계 stub(parity/src/v1shim, loader.path로 얹은 jar의 spring.factories로 등록) 대상 목록.
spring:
  mongodb:
    auto-index-creation: true
  data:
    # v1 설정의 spring.mongodb.auto-index-creation은 Spring Boot 4에서 없는 키라 무시된다. 운영 Mongo에는 예전 버전이 만든
    # 인덱스(유일 제약 포함)가 남아 있으므로, 빈 Mongo에서도 같은 제약이 걸리도록 Boot 4 키로 켠다(@Indexed·@CompoundIndex).
    mongodb:
      auto-index-creation: true
    redis:
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-null-for-primitives: false

parity:
  # OCI Object Storage(기동 시 namespace 조회), OCI Email, FCM. v2 테스트의 uploadUriIssuer·mailClient·pushClient mock과 같은 경계.
  stub-bean-classes: >-
    com.wafflestudio.snutt.common.storage.StorageClient,
    com.wafflestudio.snutt.common.mail.MailClient,
    com.wafflestudio.snutt.common.push.fcm.FcmPushClient
  # 위 stub들만 쓰던 OCI 인증 정보. 만들어지면 ~/.oci/config를 읽다가 실패한다.
  lazy-bean-names: ociAuthProvider

snutt:
  syllabus-proxy:
    # 호출하지 않고 강의계획서 URL을 만들 때만 쓴다. v1 api/application.yml과 같은 값.
    base-url: https://snutt-proxy.wafflestudio.com

google:
  firebase:
    project-id: parity
    service-account: ""
    api-key: ""
    ios:
      bundle-id: ""
    dynamic-link:
      domain-uri-prefix: ""
      link-prefix: "https://snutt.page.link"
      android:
        package-name: ""
      ios:
        bundle-id: ""
        app-store-id: ""

oidc:
  facebook:
    app-id: test-facebook-app-id
  apple:
    app-id: test-apple-app-id

http:
  response-timeout: 3s

github:
  feedback:
    token: ""
    repo:
      owner: ""
      name: ""
