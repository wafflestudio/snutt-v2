# parity가 찾은 실제 차이(버그) 중, 여러 응답에 두루 나타나 시나리오만 분리해서는 나머지 비교를 할 수 없는 것.
# parityTest(@ParityTest)는 여기 걸린 차이를 "알려진 버그"로 리포트에 남기고 실패하지 않는다.
# 각 항목은 ref의 버그 번호로 docs/parity.md "알려진 차이(버그)"에 적고, 레지스트리 없이 도는
# @ParityKnownFailure 시나리오가 같은 차이를 재현해 parityKnownFailureTest를 빨갛게 유지한다.
# 고치면 여기서 지우고 그 시나리오를 @ParityTest로 옮긴다. 허용(의도한 차이)이 아니므로 allowed-diffs.yml에 넣지 않는다.
# 형식은 allowed-diffs.yml과 같다.
