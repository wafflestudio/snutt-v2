# parity가 찾은 실제 차이(버그) 중, 여러 응답에 두루 나타나 시나리오만 분리해서는 나머지 비교를 할 수 없는 것.
# parityTest(@ParityTest)는 여기 걸린 차이를 "알려진 버그"로 리포트에 남기고 실패하지 않는다.
# 각 항목은 ref의 버그 번호로 docs/parity.md "알려진 차이(버그)"에 적고, 레지스트리 없이 도는
# @ParityKnownFailure 시나리오(KnownFailureParityTest)가 같은 차이를 재현해 parityKnownFailureTest를 빨갛게 유지한다.
# 고치면 여기서 지우고 그 시나리오를 @ParityTest로 옮긴다. 허용(의도한 차이)이 아니므로 allowed-diffs.yml에 넣지 않는다.
# 형식은 allowed-diffs.yml과 같다.

- endpoint: "* /ev-service/v1/**"
  path: $.**.user
  kind: only-v1
  reason: >-
    v1 SNUTT의 EV 프록시는 응답의 user_id를 user {id, email, local_id}로 바꿨다(EvService.kt:154-169). v1compat은 user_id를 그대로 낸다.
    강의평 웹이 user를 읽는지는 아직 모른다(다른 리뷰어의 이메일이 노출되던 v1 버그이기도 함).
  ref: "B5"
- endpoint: "* /ev-service/v1/**"
  path: $.**.user_id
  kind: only-v2
  reason: 위 B5와 같은 차이의 v2 쪽.
  ref: "B5"
- endpoint: "* /ev-service/v1/**"
  path: $.**.{grade_satisfaction,teaching_skill,gains,life_balance}
  kind: only-v1
  v1: 0.0
  reason: >-
    세부 점수가 NULL인 강의평(snuev에서 넘어온 강의평, V2 이후 점수 없이 쓴 강의평)에서 v1 EV는 0.0을 내고 v2는 필드를 뺀다.
    강의평 웹이 숫자를 기대하면 화면이 깨진다.
  ref: "B6"
- endpoint: "*"
  path: $[*].updated_at
  kind: changed
  scenario: 시간표 CRUD
  label: ["GET /v1/tables/2026/3", "DELETE /v1/tables/{id}"]
  reason: >-
    다른 시간표를 대표로 지정하면 v2는 대표에서 풀린 시간표의 updated_at도 바꾼다(BaseEntity @UpdateTimestamp). v1은 isPrimary만 바꾸고
    updatedAt은 그대로 뒀다(TimetableServiceImpl.setPrimary의 copy). 앱은 updated_at이 가장 최근인 시간표를 처음에 연다(/v1/tables/recent).
  ref: "B7"
