// build-v1-jar.sh가 v1 빌드에 넘기는 init script. v1 레포는 고치지 않고 Hibernate bytecode enhancement 결과를 파일시스템과 무관하게 만든다.
//
// 문제: Hibernate Gradle 플러그인(org.hibernate.orm 7.2)은 컴파일 출력 디렉터리를 File.listFiles() 순서(파일시스템의 readdir 순서)로
// 돌며 클래스 파일을 제자리에서 덮어쓰고, 다음 클래스를 enhance할 때 그 디렉터리를 classpath로 읽는다. 그래서 상위 클래스가
// 먼저 enhance됐는지에 따라 하위 클래스의 결과가 달라진다. snutt-ev는 @MappedSuperclass BaseEntity(필드가 모두 val)를
// 엔티티보다 먼저 enhance하면 엔티티가 BaseEntity에 없는 $$_hibernate_write_id를 부르게 되고, 기동 후 엔티티 id를 읽을 때
// NoSuchMethodError가 난다. tmpfs(로컬 /tmp)에서는 domain/이 common/보다 먼저 나와 정상이었고, CI 러너의 ext4에서는 반대였다.
//
// 해결: 플러그인의 enhancement action을 같은 일을 하는 action으로 바꾼다. 차이는 두 가지다.
// - 다른 클래스는 enhance 전 사본에서 읽는다. 그래서 어느 클래스도 다른 클래스가 이미 enhance됐는지에 영향받지 않는다.
//   (정상이던 jar에서 엔티티가 본 상태와 같다. 검증은 docs/parity.md "v1 jar 빌드".)
// - 클래스 파일을 경로 순으로 정렬해 돈다.
// enhancer 생성과 classloader 구성은 플러그인의 public 메서드(EnhancementHelper.generateEnhancer, Helper.toClassLoader)를 그대로 쓴다.
// hibernate 플러그인을 쓰지 않는 프로젝트(snutt)에는 아무것도 하지 않는다.

import java.nio.file.Files
import java.nio.file.StandardCopyOption

def pluginActionPrefix = 'org.hibernate.orm.tooling.gradle.HibernateOrmPlugin'

def innerActionClassName = { action ->
    // Gradle이 doLast 액션을 감싼 래퍼(TaskActionWrapper)의 실제 액션 클래스 이름
    def inner = action
    while (inner != null && inner.metaClass.hasProperty(inner, 'action')) {
        inner = inner.action
    }
    inner?.getClass()?.name
}

def enhanceStably = { task, spec ->
    def project = task.project
    def pluginLoader = spec.getClass().classLoader
    def helperClass = pluginLoader.loadClass('org.hibernate.orm.tooling.gradle.Helper')
    def enhancementHelperClass = pluginLoader.loadClass('org.hibernate.orm.tooling.gradle.enhance.EnhancementHelper')

    def sourceSet = project.extensions.getByType(JavaPluginExtension).sourceSets.getByName(spec.sourceSet.get())
    def enhancement = spec.enhancement.get()
    if (!enhancement.classNames.getOrElse([]).isEmpty()) {
        throw new GradleException("stable-hibernate-enhancement: enhancement.classNames 지정은 지원하지 않는다(${project.path})")
    }
    def outputDir = task.destinationDirectory.get().asFile

    def pristineRoot = Files.createTempDirectory('hibernate-pristine').toFile()
    try {
        def pristineDirs = []
        sourceSet.output.classesDirs.files.sort { it.absolutePath }.eachWithIndex { dir, i ->
            def copy = new File(pristineRoot, "$i")
            if (dir.directory) {
                project.copy { from dir; into copy }
            }
            pristineDirs << copy
        }
        def dependencyFiles = project.configurations.getByName(sourceSet.compileClasspathConfigurationName).files
        def loader = helperClass.getMethod('toClassLoader', FileCollection, Set)
            .invoke(null, project.files(pristineDirs), dependencyFiles)
        def specClass = pluginLoader.loadClass('org.hibernate.orm.tooling.gradle.enhance.EnhancementSpec')
        def enhancer = enhancementHelperClass.getMethod('generateEnhancer', ClassLoader, specClass)
            .invoke(null, loader, enhancement)

        def classFiles = project.fileTree(outputDir).matching { include '**/*.class' }.files.sort { it.absolutePath }
        def classNameOf = { File f ->
            outputDir.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '.' as char).replaceAll(/\.class$/, '')
        }
        def originals = classFiles.collectEntries { [(it): Files.readAllBytes(it.toPath())] }
        classFiles.each { enhancer.discoverTypes(classNameOf(it), originals[it]) }
        def count = 0
        classFiles.each { f ->
            byte[] enhanced = enhancer.enhance(classNameOf(f), originals[f])
            if (enhanced != null) {
                def lastModified = f.lastModified()
                def tmp = new File(f.parentFile, f.name + '.enhanced')
                tmp.bytes = enhanced
                Files.move(tmp.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                f.setLastModified(lastModified)
                count++
            }
        }
        if (loader instanceof Closeable) loader.close()
        task.logger.quiet("stable-hibernate-enhancement: ${task.path} 클래스 ${classFiles.size()}개 중 ${count}개 enhance")
    } finally {
        project.delete(pristineRoot)
    }
}

gradle.projectsEvaluated {
    // 플러그인은 자기 taskGraph.whenReady에서 컴파일 태스크에 doLast를 단다. 여기서 등록한 whenReady는 그 뒤에 돈다.
    gradle.taskGraph.whenReady { graph ->
        graph.allTasks.each { task ->
            def spec = task.project.extensions.findByName('hibernate')
            if (spec == null) return
            def pluginActions = task.actions.findAll { innerActionClassName(it)?.startsWith(pluginActionPrefix) }
            if (pluginActions.isEmpty()) return
            task.actions.removeAll(pluginActions)
            pluginActions.each { task.doLast { t -> enhanceStably(t, spec) } }
        }
    }
}
