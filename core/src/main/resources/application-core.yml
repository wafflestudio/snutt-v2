snutt:
  syllabus-proxy:
    base-url: https://snutt-proxy.wafflestudio.com
  mail:
    compartment-id: ocid1.compartment.oc1..aaaaaaaaxzo4fga6br76o3e34rshtsl6alzripmgdh7f4lg4u4tzezosypaq

spring:
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/snutt
    username: root
    password: ""
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
