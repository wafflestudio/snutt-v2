spring:
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  data:
    redis:
      timeout: 3s
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  flyway:
    locations: classpath:db/migration

