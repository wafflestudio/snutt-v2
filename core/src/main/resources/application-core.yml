spring:
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/snutt
    username: root
    password: ${SNUTT_DB_PASSWORD:}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: dev | prod
  datasource:
    url: ${SNUTT_DB_URL}
    username: ${SNUTT_DB_USERNAME}
    password: ${SNUTT_DB_PASSWORD}
