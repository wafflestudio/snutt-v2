spring:
  application:
    name: snutt-api
  config:
    import: classpath:application-core.yml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-match: /v2/**
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false
