spring:
  application:
    name: snutt-api
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  config:
    import: classpath:application-core.yml

snutt:
  diary:
    push-sample-rate: 0.1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local | test
# Not real credentials
snutt:
  auth:
    platform-keys: ios:test-ios-key,android:test-android-key,web:test-web-key
    legacy-secret-key: test-legacy-secret-key-0123456789abcdef
