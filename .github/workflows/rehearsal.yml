name: Rehearsal

# 마이그레이션 리허설 도구를 합성 덤프로 끝까지 돌린다(docs/migration-rehearsal.md). 이관 코드·v2 스키마·리허설 도구가 바뀐 PR과
# nightly에서 돈다. 운영 덤프로 하는 리허설(:migration:maskDump, :migration:rehearse)은 덤프가 필요해 CI에 넣지 않는다.
on:
  pull_request:
    branches: [ develop, prod ]
    paths:
      - 'migration/**'
      - 'core/src/main/resources/db/migration/**'
      - 'core/src/testFixtures/**'
      - '.github/workflows/rehearsal.yml'
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run rehearsal tests
        run: ./gradlew rehearsalTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-report
          path: |
            migration/build/reports/tests/rehearsalTest
            migration/build/test-results/rehearsalTest
          retention-days: 14
