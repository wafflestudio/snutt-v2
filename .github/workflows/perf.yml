name: Perf

# 운영 분포 데이터에서 리포지토리 쿼리의 실행계획(EXPLAIN)을 검증한다(docs/testing.md "실행계획").
# 실행계획을 바꿀 수 있는 경로(리포지토리 쿼리, 엔티티 매핑, Flyway 스키마, perf 하네스)가 바뀐 PR과 nightly에서 돈다.
on:
  pull_request:
    branches: [ develop, prod ]
    paths:
      - '**/src/main/kotlin/**/repository/**'
      - '**/src/main/kotlin/**/*Repository.kt'
      - '**/src/main/kotlin/**/model/**'
      - 'core/src/main/resources/db/migration/**'
      - 'api/src/test/kotlin/com/wafflestudio/snutt/api/perf/**'
      - 'core/src/testFixtures/kotlin/com/wafflestudio/snutt/core/test/perf/**'
      - '.github/workflows/perf.yml'
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run perf tests
        run: ./gradlew perfTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: |
            */build/reports/tests/perfTest
            */build/test-results/perfTest
          retention-days: 14
